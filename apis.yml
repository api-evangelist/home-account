name: Home Account
description: >-
  Home-Account (Home Account) was a consumer financial-services startup focused on mortgage
  management and consumer credit-risk analytics, backed by Uncork Capital (formerly SoftTech VC).
  Per its LinkedIn profile, the company built patent-worthy consumer risk-analytic tooling to help
  homeowners manage mortgages and understand consumer credit risk, operating in the Consumer
  Services sector with roughly 11-50 employees and a base in the Fort Mill, South Carolina (ZIP
  29708) area. Its original website, home-account.com, no longer resolves, and Uncork Capital's
  portfolio record associates the company with Bills.com. No public API, developer portal, OpenAPI,
  or other machine-readable API artifacts were found during enrichment; this record remains an
  identity-only profile of a legacy/defunct portfolio company added to the API Evangelist network as
  a VC-portfolio lead.
